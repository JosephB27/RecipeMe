[tool.poetry]
name = "recipeme-backend"
version = "0.1.0"
description = "Backend API for RecipeMe video-to-recipe conversion"
authors = ["RecipeMe Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-dotenv = "^1.0.0"
httpx = "^0.26.0"
yt-dlp = "^2023.11.16"
supabase = "^2.9.0"
pyjwt = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
